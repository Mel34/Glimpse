[workspace]
resolver = "2"
members = [
    "engine",
    "ui",
]

[workspace.package]
version = "0.5.0"
authors = ["Glimpse Contributors"]
edition = "2021"
license = "LGPL-2.1-or-later"
repository = "https://github.com/Mel34/Glimpse"
description = "Linux media player using GTK4, libadwaita, FFmpeg, and native PipeWire audio"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1