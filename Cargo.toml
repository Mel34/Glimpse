[workspace]
resolver = "2"
members = [
    "engine",
    "ui",
]

[workspace.package]
version = "0.1.0"
authors = ["Glimpse Contributors"]
edition = "2021"
license = "LGPL-2.1-or-later"
repository = "https://github.com/Mel34/Glimpse"
description = "Clean, predictable Linux media player in Rust using GTK4, libadwaita, and in-process FFmpeg libav* libraries"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"