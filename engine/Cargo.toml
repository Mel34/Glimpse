[package]
name = "glimpse-engine"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Experimental in-process FFmpeg (libav*) media playback engine scaffold for Glimpse"

[lib]
name = "glimpse_engine"
path = "src/lib.rs"

[[bin]]
name = "glimpse_probe"
path = "src/bin/glimpse_probe.rs"

[features]
default = []
# Native integrations remain optional so the GTK playback baseline builds independently.
audio-cpal = ["dep:cpal"]
ffmpeg-system = ["dep:ffmpeg-the-third"]

[dependencies]
# ffmpeg-the-third 6.0.0 is built for the FFmpeg 9.0 API generation.
ffmpeg-the-third = { version = "6.0.0", optional = true }
cpal = { version = "0.15", optional = true }
crossbeam-channel = "0.5"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
serde_json = "1.0"
