[package]
name = "glimpse-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Experimental in-process FFmpeg (libav*) media playback engine scaffold for Glimpse"

[lib]
name = "glimpse_engine"
path = "src/lib.rs"

[[bin]]
name = "glimpse_probe"
path = "src/bin/glimpse_probe.rs"

[features]
default = []
# Optional native audio and FFmpeg linking features.
audio-cpal = ["dep:cpal"]
ffmpeg-system = ["dep:ffmpeg-the-third"]

[dependencies]
# ffmpeg-the-third 6.x supports system FFmpeg 5.1 through 9.0.
ffmpeg-the-third = { version = "6.0", optional = true }
cpal = { version = "0.15", optional = true }
crossbeam-channel = "0.5"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"