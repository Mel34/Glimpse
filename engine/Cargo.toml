[package]
name = "glimpse-engine"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "In-process FFmpeg media playback engine for Glimpse"

[lib]
name = "glimpse_engine"
path = "src/lib.rs"

[[bin]]
name = "glimpse_probe"
path = "src/bin/glimpse_probe.rs"

[[bin]]
name = "glimpse_audio_probe"
path = "src/bin/glimpse_audio_probe.rs"
required-features = ["audio-pipewire"]

[[bin]]
name = "glimpse_audio_playback_probe"
path = "src/bin/glimpse_audio_playback_probe.rs"
required-features = ["audio-pipewire", "ffmpeg-system"]

[[bin]]
name = "glimpse_player_lifecycle_probe"
path = "src/bin/glimpse_player_lifecycle_probe.rs"
required-features = ["audio-pipewire", "ffmpeg-system"]

[[bin]]
name = "glimpse_av_sync_probe"
path = "src/bin/glimpse_av_sync_probe.rs"
required-features = ["audio-pipewire", "ffmpeg-system"]

[features]
default = []
# Native integrations remain optional so the GTK playback baseline builds independently.
audio-cpal = ["dep:cpal"]
audio-pipewire = ["dep:pipewire", "dep:rtrb"]
ffmpeg-system = ["dep:ffmpeg-the-third", "dep:libc"]

[dependencies]
# ffmpeg-the-third 6.0.0 is built for the FFmpeg 9.0 API generation.
ffmpeg-the-third = { version = "6.0.0", optional = true }
libc = { version = "0.2", optional = true }
cpal = { version = "0.15", optional = true }
pipewire = { version = "0.10.1", optional = true, features = ["v0_3_50"] }
rtrb = { version = "0.4", optional = true }
crossbeam-channel = "0.5"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
serde_json = "1.0"
